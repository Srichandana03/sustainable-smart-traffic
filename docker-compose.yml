services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecopath
      POSTGRES_PASSWORD: ecopath
      POSTGRES_DB: ecopath
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecopath"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://ecopath:ecopath@db:5432/ecopath
      SECRET_KEY: dev-secret-change-me
      DETECTOR_BACKEND: auto
    volumes: ["./data:/app/data", "./models:/app/models"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
